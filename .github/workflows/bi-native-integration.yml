name: BI Native Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/internal/bi/**'
      - 'backend/internal/**/desktop*'
      - 'backend/migrations/**'
      - 'docs/mobile-bi/**'
      - 'frontend/src/api/desktopStructure.ts'
      - 'frontend/src/api/desktopOrganization.ts'
      - 'frontend/src/api/admin/desktop.ts'
      - 'frontend/tests/desktop-structure/**'

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install Web client integration dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Independent identity and Desktop integration
        working-directory: backend
        env:
          DESKTOP_REQUIRE_WEB_HTTP: '1'
        run: go test -tags=integration ./internal/bi ./internal/repository -run 'Independent|OperationsMetadata|Desktop.*(Native|Period|Report)|DesktopStructure|BIUpgrade' -count=1 -timeout=25m
      - name: Native protocol and period unit tests
        working-directory: backend
        run: go test -tags=unit ./internal/server/routes ./internal/service -run 'BI|DesktopPeriod|DesktopStructure' -count=1
