          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - &id003
        name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 2048
        description: 不透明游标；绑定过滤/排序/上下文。参数改变不能复用。
