openapi: 3.1.0
info:
  title: 得酷企业AI管理小程序 API
  version: 1.1.0
  description: API v1.1.0 已在本地实现并通过契约核验，尚未完成真实环境联调或上线验收。实施与操作说明见 implementation.md 和 integration-runbook.md；原 protocol.md 尚未随交接提供。接口使用相对路径，部署域名由环境配置，不包含真实凭证。
servers:
- url: /
  description: 与企业服务同源的相对地址；生产需合法HTTPS域名。
tags:
- name: 分享
- name: 启动
- name: 团队
- name: 场景
- name: 应用
- name: 总览
- name: 搜索
- name: 来源
- name: 案例
- name: 知识
- name: 筛选
- name: 简报
- name: 设置
- name: 评估
- name: 身份
- name: 采集
paths:
  /api/bi/v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: 读取公开启动信息
      description: 读取公开启动信息。遵循协议中的范围、权限和数据口径规则。
      tags:
      - 启动
      security: []
      x-capability: public
      x-implementation-status: implemented-local
      responses:
        '200':
          description: 读取公开启动信息成功响应
          headers:
            X-Request-ID:
              schema: &id001
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_.:-]+$
              description: 诊断请求ID
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bootstrap'
              example:
                api_version: v1
                min_client_version: 0.1.0
                timezone: Asia/Shanghai
                demo_available: false
                binding_enabled: true
                privacy_notice_version: '2026-09-22'
                privacy_notice_url: https://example.invalid/legal/bi-privacy
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/bi/v1/auth/wechat:
    post:
      operationId: loginWeChat
      summary: 微信登录或开始绑定
      description: 新wx.login code换取身份；仅已绑定有效管理账号签发Session。未绑定返回BindingChallenge，不能访问企业数据。
      tags:
      - 身份
      security: []
      x-capability: public
      x-implementation-status: implemented-local
      responses:
        '200':
          description: 微信登录或开始绑定成功响应
          headers:
            X-Request-ID:
              schema: *id001
              description: 诊断请求ID
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeChatLoginResult'
              example:
                result: authenticated
                access_token: demo-access_token-not-a-real-credential
                refresh_token: demo-refresh_token-not-a-real-credential
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 43200
                user:
                  id: manager_demo
                  display_name: 演示管理者
                  capabilities:
                  - analytics:read
                  - knowledge:read
                  - sources:read
                  - evaluations:read
                  - members:read
                  - reports:read
                  - reports:create
                  - reports:copy
                  - reports:share
                  authorization_version: acl_3
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              code: 示例
              client_version: 示例
  /api/bi/v1/auth/bindings/approve:
    post:
      operationId: approveBinding
      summary: 管理账号确认微信绑定
      description: 仅现有sub2api登录会话，沿用原验证码/2FA/会话绑定策略；确认当前账号与挑战码，不能输入任意user_id。绑定不创建新企业权限。
      tags:
      - 身份
      security:
      - Sub2apiBearer: []
      x-capability: existing_manager
      x-implementation-status: implemented-local
      responses:
        '200':
          description: 管理账号确认微信绑定成功响应
          headers:
            X-Request-ID:
              schema: *id001
              description: 诊断请求ID
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingApproval'
            example:
              user_code: DEMO1234
              confirm_binding: true
  /api/bi/v1/auth/bindings/exchange:
    post:
      operationId: exchangeBinding
      summary: 小程序完成绑定并登录
      description: 验证ticket及新code是同一微信主体；审批未完成返回202，完成后一次性消费并签发Session；失效410。
      tags:
      - 身份
      security: []
      x-capability: public
      x-implementation-status: implemented-local
      responses:
        '200':
          description: 小程序完成绑定并登录成功响应
          headers:
            X-Request-ID:
              schema: *id001
              description: 诊断请求ID
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
              example:
                result: authenticated
                access_token: demo-access_token-not-a-real-credential
                refresh_token: demo-refresh_token-not-a-real-credential
                token_type: Bearer
                expires_in: 900
                refresh_expires_in: 43200
                user:
                  id: manager_demo
                  display_name: 演示管理者
                  capabilities:
                  - analytics:read
                  - knowledge:read
                  - sources:read
                  - evaluations:read
                  - members:read
                  - reports:read
                  - reports:create
                  - reports:copy
                  - reports:share
                  authorization_version: acl_3
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        '202':
          description: 等待管理账号确认
          headers:
            X-Request-ID:
              schema: *id001
            Cache-Control:
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingBinding'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BindingExchange'
            example:
              binding_ticket: demo-binding_ticket-not-a-real-credential
              code: 示例
  /api/bi/v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: 轮换当前会话
      description: 轮换当前会话。遵循协议中的范围、权限和数据口径规则。
