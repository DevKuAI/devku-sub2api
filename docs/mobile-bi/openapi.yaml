        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: demo-refresh_token-not-a-real-credential
  /api/bi/v1/auth/binding:
    delete:
      operationId: removeBinding
      summary: 解除当前微信绑定
      description: 仅用户明确操作；撤销该绑定所有小程序会话。企业角色不改变，手机丢失时由原后台账号撤销绑定。
      tags:
      - 身份
      security:
      - MobileBearer: []
      x-capability: self
      x-implementation-status: implemented-local
