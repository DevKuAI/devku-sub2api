          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: demo-refresh_token-not-a-real-credential
  /api/bi/v1/auth/logout:
    post:
      operationId: logoutSession
      summary: 退出并撤销当前会话
      description: 幂等；已撤销token也返回ok。客户端先清空内存；失败时不得恢复会话。
      tags:
      - 身份
      security: []
      x-capability: refresh_token
      x-implementation-status: implemented-local
      responses:
        '200':
          description: 退出并撤销当前会话成功响应
          headers:
            X-Request-ID:
              schema: *id001
              description: 诊断请求ID
            Cache-Control:
              schema:
                type: string
              description: private, no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ack'
              example:
                ok: true
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
