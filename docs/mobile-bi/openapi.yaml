      - records
      - complete_through
      - history_start_date
      - initial_backfill_complete
      description: records为空仅作水位心跳；不能修改业务对象；来源历史完整性声明同样校验。
      allOf:
      - if:
          properties:
            initial_backfill_complete:
              const: true
        then:
          properties:
            complete_through:
              type: string
              format: date-time
    ImportJob:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        source_id: *id001
        status:
          type: string
          enum:
          - queued
          - validating
          - applied
          - rejected
        received_at: *id011
        applied_at:
          anyOf:
          - *id011
          - type: 'null'
        checkpoint:
          anyOf:
          - type: string
          - type: 'null'
        data_revision:
          anyOf:
          - *id001
          - type: 'null'
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              record_index:
                anyOf:
                - *id012
                - type: 'null'
                description: 批次级或水位错误为null；记录错误为从0开始的下标。
              code:
                type: string
                enum:
                - INVALID_REFERENCE
                - INVALID_TOKENS
                - REVISION_CONFLICT
                - IMMUTABLE_VERSION
                - INVALID_IDENTITY
                - FORBIDDEN_SOURCE
                - INVALID_INTERVAL
                - INVALID_WATERMARK
                - INTERNAL_ERROR
              message:
                type: string
            required:
            - record_index
            - code
            - message
      required:
      - id
      - source_id
      - status
      - received_at
      - applied_at
      - checkpoint
      - data_revision
      - errors
      allOf:
      - if:
          properties:
            status:
              const: applied
        then:
          properties:
            applied_at:
              type: string
              format: date-time
            checkpoint:
              type: string
              minLength: 1
            data_revision:
              $ref: '#/components/schemas/Id'
            errors:
              maxItems: 0
        else:
          properties:
            applied_at:
              type: 'null'
            checkpoint:
              type: 'null'
            data_revision:
              type: 'null'
      - if:
          properties:
            status:
              const: rejected
        then:
          properties:
            errors:
              minItems: 1
        else:
          properties:
            errors:
              maxItems: 0
