        '204':
          description: 解除当前微信绑定成功响应
          headers:
            X-Request-ID:
              schema: *id001
              description: 诊断请求ID
            Cache-Control:
              schema:
                type: string
              description: private, no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
