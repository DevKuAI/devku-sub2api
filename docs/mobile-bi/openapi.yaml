            $ref: '#/components/schemas/ImportRecord'
          minItems: 0
          maxItems: 500
        complete_through:
          anyOf:
          - &id014
            type: string
            format: date-time
          - type: 'null'
          description: 初次回灌尚无可信完整水位时为null；已建立水位后不得清空或倒退。
