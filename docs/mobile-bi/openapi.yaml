      scheme: bearer
      description: 服务端接入凭证；绑定企业、来源和允许记录类型，不下发小程序。
  schemas:
    Id: *id001
    TokenCount:
      type: string
      description: 十进制非负整数，客户端用 BigInt/十进制库计算；显示层可缩写。
      pattern: ^(0|[1-9][0-9]*)$
      maxLength: 30
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - INVALID_ARGUMENT
          - INTERNAL_ERROR
          - CHECKPOINT_CONFLICT
          - IMPORT_BUSY
          - BINDING_CONFLICT
          - UNAUTHENTICATED
          - FORBIDDEN
          - NOT_FOUND
          - CONFLICT
          - PRECONDITION_FAILED
          - PRECONDITION_REQUIRED
          - CONTEXT_EXPIRED
          - CONTEXT_REVOKED
          - IDEMPOTENCY_CONFLICT
          - RATE_LIMITED
          - DATA_UNAVAILABLE
          - UPSTREAM_UNAVAILABLE
          - PAYLOAD_TOO_LARGE
          - BINDING_EXPIRED
        message:
          type: string
        request_id: *id001
        retryable: *id005
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
              reason:
                type: string
            required:
            - field
            - reason
      required:
      - code
      - message
      - request_id
      - retryable
      - details
    Ack:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required:
      - ok
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        display_name:
          type: string
        capabilities:
          type: array
          items:
            type: string
        authorization_version: *id001
      required:
      - id
      - display_name
      - capabilities
      - authorization_version
    Organization:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
        role:
          type: string
          enum:
          - org_admin
          - team_manager
          - viewer
        all_teams: *id005
        team_ids:
          type: array
          items: *id001
        capabilities:
          type: array
          items:
            type: string
      required:
      - id
      - name
      - status
      - role
      - all_teams
      - team_ids
      - capabilities
    Session:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
          enum:
          - authenticated
        access_token:
          type: string
          minLength: 1
        refresh_token:
          type: string
          minLength: 1
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          const: 900
        refresh_expires_in:
          type: integer
          const: 43200
        user:
          $ref: '#/components/schemas/User'
      required:
      - result
      - access_token
      - refresh_token
      - token_type
      - expires_in
      - refresh_expires_in
      - user
    BindingChallenge:
      type: object
      additionalProperties: false
      properties:
        result:
          type: string
          enum:
          - binding_required
        binding_ticket:
          type: string
          minLength: 32
        user_code:
          type: string
          pattern: ^[A-Z0-9]{8}$
        expires_at: &id011
          type: string
          format: date-time
        verification_path:
          type: string
          description: 现有 sub2api 站点上的绑定确认路径，不接受用户任意重定向 URL。
          pattern: ^/[^/].*
      required:
      - result
      - binding_ticket
      - user_code
      - expires_at
      - verification_path
    WeChatLoginResult:
      oneOf:
      - $ref: '#/components/schemas/Session'
      - $ref: '#/components/schemas/BindingChallenge'
    PendingBinding:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum:
          - pending
        retry_after_seconds:
          type: integer
          minimum: 3
          maximum: 30
      required:
      - status
      - retry_after_seconds
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          description: wx.login 获得的一次性 code，仅用于服务器 code2session。
          minLength: 1
          maxLength: 256
        client_version:
          type: string
          maxLength: 32
      required:
      - code
      - client_version
    BindingApproval:
      type: object
      additionalProperties: false
      properties:
        user_code:
          type: string
          pattern: ^[A-Z0-9]{8}$
        confirm_binding:
          type: boolean
          const: true
      required:
      - user_code
      - confirm_binding
    BindingExchange:
      type: object
      additionalProperties: false
      properties:
        binding_ticket:
          type: string
          minLength: 32
          maxLength: 512
        code:
          type: string
          description: 新的 wx.login code，必须属于同一小程序主体。
          minLength: 1
          maxLength: 256
      required:
      - binding_ticket
      - code
    RefreshRequest:
      type: object
      additionalProperties: false
      properties:
        refresh_token:
          type: string
          minLength: 1
          maxLength: 2048
      required:
      - refresh_token
    Bootstrap:
      type: object
      additionalProperties: false
      properties:
        api_version:
          type: string
          enum:
          - v1
        min_client_version:
          type: string
        timezone:
          type: string
          enum:
          - Asia/Shanghai
        demo_available: *id005
        binding_enabled: *id005
        privacy_notice_version:
          type: string
          description: 后台已发布 BI 隐私说明的版本号；与公开页面一致。
        privacy_notice_url:
          type: string
          description: 程序内公开页面的绝对 HTTPS 地址，仅由 BI 隐私说明独立配置的 site_url 加 /legal/bi-privacy 生成；不读取原站前端地址。未发布说明或地址无效时 bootstrap 返回 503 DATA_UNAVAILABLE。
          format: uri
      required:
      - api_version
      - min_client_version
      - timezone
      - demo_available
      - binding_enabled
      - privacy_notice_version
      - privacy_notice_url
    Filters:
      type: object
      additionalProperties: false
      properties:
        period:
          type: string
          enum:
          - week
          - current
          - month
        team_ids:
          type: array
          items: *id001
          maxItems: 100
          uniqueItems: true
        application_id: *id001
        scene_id: *id001
      required:
      - period
      - team_ids
      description: team_ids=[] 表示全部已授权团队，绝不代表绕过权限。无效 ID 拒绝。
    Range:
      type: object
      additionalProperties: false
      properties:
        start_date: &id010
          type: string
          format: date
        end_date_exclusive: *id010
        timezone:
          type: string
          enum:
          - Asia/Shanghai
        label:
          type: string
        complete_days: &id012
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - start_date
      - end_date_exclusive
      - timezone
      - label
      - complete_days
    Freshness:
      type: object
      additionalProperties: false
      properties:
        source_id: *id001
        status:
          type: string
          enum:
          - ready
          - partial
          - stale
          - unavailable
        complete_through:
          anyOf:
          - *id011
          - type: 'null'
        missing_dimensions:
          type: array
          items:
            type: string
            enum:
            - identity
            - organization
            - application
            - scene
            - tokens
            - outcome
            - history
            - knowledge
            - rating
            - evaluation
        reason:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - source_id
      - status
      - complete_through
      - missing_dimensions
      - reason
    Context:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        organization_id: *id001
        filters:
          $ref: '#/components/schemas/Filters'
        range:
          $ref: '#/components/schemas/Range'
        comparison_range:
          $ref: '#/components/schemas/Range'
        as_of: *id011
        content_as_of: *id011
        data_revision: *id001
        metric_version:
          type: string
          enum:
          - bi-v1
        authorization_version: *id001
        expires_at: *id011
        status:
          type: string
          enum:
          - ready
          - empty
          - partial
          - not_observable
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Freshness'
      required:
      - id
      - organization_id
      - filters
      - range
      - comparison_range
      - as_of
      - content_as_of
      - data_revision
      - metric_version
      - authorization_version
      - expires_at
      - status
      - sources
    Metric:
      type: object
      additionalProperties: false
      properties:
        value:
          anyOf:
          - type: number
            minimum: 0
            maximum: 9007199254740991
          - type: 'null'
        numerator:
          anyOf:
          - *id012
          - type: 'null'
        denominator:
          anyOf:
          - *id012
          - type: 'null'
        status:
          type: string
          enum:
          - ready
          - not_observable
          - unavailable
          - partial
        reason:
          anyOf:
          - type: string
            enum:
            - zero_denominator
            - history_incomplete
            - period_incomplete
            - source_unavailable
            - restricted_population
            - unknown_outcome
            - unknown_identity
          - type: 'null'
      required:
      - value
      - numerator
      - denominator
      - status
      - reason
    Comparison:
      type: object
      additionalProperties: false
      properties:
        previous:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        relative_change:
          anyOf:
          - type: number
          - type: 'null'
        rate_difference:
          anyOf:
          - type: number
            minimum: -1
            maximum: 1
          - type: 'null'
        comparable: *id005
        reason:
          anyOf:
          - type: string
            enum:
            - no_baseline
            - incomplete_data
            - different_definition
            - restricted_population
          - type: 'null'
      required:
      - previous
      - relative_change
      - rate_difference
      - comparable
      - reason
    TokenTotals:
      type: object
      additionalProperties: false
      properties:
        input:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        output:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        cache_read:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        cache_write:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        total:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        human:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        automatic:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        unknown:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        non_cohort_human_tokens:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        measured_requests:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        unmeasured_requests: *id012
      required:
      - input
      - output
      - cache_read
      - cache_write
      - total
      - human
      - automatic
      - unknown
      - non_cohort_human_tokens
      - measured_requests
      - unmeasured_requests
      description: 有测量记录时返回已观测Token和measured/unmeasured覆盖；全部未测量为null；完整且无调用返回字符串0。含未测量调用时不得生成总量增长结论。
    UsageStats:
      type: object
      additionalProperties: false
      properties:
        context_id: *id001
        eligible_members:
          $ref: '#/components/schemas/Metric'
        activated_members:
          $ref: '#/components/schemas/Metric'
        active_members:
          $ref: '#/components/schemas/Metric'
        stable_members:
          $ref: '#/components/schemas/Metric'
        repeat_members:
          $ref: '#/components/schemas/Metric'
        adoption_rate:
          $ref: '#/components/schemas/Metric'
        adoption_comparison:
          $ref: '#/components/schemas/Comparison'
        tokens:
          $ref: '#/components/schemas/TokenTotals'
        active_applications:
          anyOf:
          - *id012
          - type: 'null'
        requests:
          type: [integer, 'null']
          minimum: 0
          maximum: 9007199254740991
        failed_requests:
          anyOf:
          - *id012
          - type: 'null'
        unknown_outcome_requests:
          anyOf:
          - *id012
          - type: 'null'
        human_requests:
          type: [integer, 'null']
          minimum: 0
          maximum: 9007199254740991
        failure_rate:
          $ref: '#/components/schemas/Metric'
        rated_interactions:
          anyOf:
          - *id012
          - type: 'null'
        helpful_interactions:
          anyOf:
          - *id012
          - type: 'null'
        helpful_rate:
          $ref: '#/components/schemas/Metric'
        feedback_coverage:
          $ref: '#/components/schemas/Metric'
        effective_filters:
          $ref: '#/components/schemas/Filters'
          description: 上下文范围与当前路径实体取交集后的有效条件。
      required:
      - context_id
      - eligible_members
      - activated_members
      - active_members
      - stable_members
      - repeat_members
      - adoption_rate
      - adoption_comparison
      - tokens
      - active_applications
      - requests
      - failed_requests
      - unknown_outcome_requests
      - human_requests
      - failure_rate
      - rated_interactions
      - helpful_interactions
      - helpful_rate
      - feedback_coverage
      - effective_filters
    Target:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - team
          - member
          - application
          - scene
          - knowledge
          - case
          - evaluation
          - metric
        id: *id001
      required:
      - kind
      - id
      description: 服务端仅返回客户端白名单内的实体跳转，不返回任意 URL。
    Finding:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        title:
          type: string
        fact:
          type: string
        interpretation:
          anyOf:
          - type: string
          - type: 'null'
        interpretation_status:
          type: string
          enum:
          - none
          - hypothesis
        evidence_metric_keys:
          type: array
          items:
            type: string
        target:
          $ref: '#/components/schemas/Target'
      required:
      - id
      - title
      - fact
      - interpretation
      - interpretation_status
      - evidence_metric_keys
      - target
    AssetStats:
      type: object
      additionalProperties: false
      properties:
        context_id: *id001
        content_as_of: *id011
        valid_knowledge:
          anyOf:
          - *id012
          - type: 'null'
        reused_valid_knowledge:
          anyOf:
          - *id012
          - type: 'null'
        reuse_rate:
          $ref: '#/components/schemas/Metric'
        draft_knowledge:
          anyOf:
          - *id012
          - type: 'null'
        expired_knowledge:
          anyOf:
          - *id012
          - type: 'null'
        stale_referenced_now:
          anyOf:
          - *id012
          - type: 'null'
        expired_at_use:
          anyOf:
          - *id012
          - type: 'null'
        added_valid:
          anyOf:
          - *id012
          - type: 'null'
        updated_valid:
          anyOf:
          - *id012
          - type: 'null'
      required:
      - context_id
      - content_as_of
      - valid_knowledge
      - reused_valid_knowledge
      - reuse_rate
      - draft_knowledge
      - expired_knowledge
      - stale_referenced_now
      - expired_at_use
      - added_valid
      - updated_valid
    Overview:
      type: object
      additionalProperties: false
      properties:
        context_id: *id001
        stats:
          $ref: '#/components/schemas/UsageStats'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
          maxItems: 3
        assets:
          anyOf:
          - $ref: '#/components/schemas/AssetStats'
          - type: 'null'
          description: 无knowledge:read时为null；有权限但缺数据时使用字段为null的AssetStats。
      required:
      - context_id
      - stats
      - findings
      - assets
    TrendPoint:
      type: object
      additionalProperties: false
      properties:
        start_date: *id010
        end_date_exclusive: *id010
        tokens:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        active_members:
          anyOf:
          - *id012
          - type: 'null'
        average_daily_active:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
        status:
          type: string
          enum:
          - ready
          - partial
          - unavailable
      required:
      - start_date
      - end_date_exclusive
      - tokens
      - active_members
      - average_daily_active
      - status
    Trend:
      type: object
      additionalProperties: false
      properties:
        context_id: *id001
        bucket:
          type: string
          enum:
          - day
          - seven_day
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
          maxItems: 31
      required:
      - context_id
      - bucket
      - points
    FrequencyBucket:
      type: object
      additionalProperties: false
      properties:
        min_days: *id012
        max_days:
          anyOf:
          - *id012
          - type: 'null'
        members:
          anyOf:
          - *id012
          - type: 'null'
      required:
      - min_days
      - max_days
      - members
    RetentionCell:
      type: object
      additionalProperties: false
      properties:
        week_offset:
          type: integer
          minimum: 1
          maximum: 3
        observed_range:
          $ref: '#/components/schemas/Range'
        retained:
          anyOf:
          - *id012
          - type: 'null'
        rate:
          $ref: '#/components/schemas/Metric'
      required:
      - week_offset
      - observed_range
      - retained
      - rate
    RetentionCohort:
      type: object
      additionalProperties: false
      properties:
        first_week: *id010
        size: *id012
        cells:
          type: array
          items:
            $ref: '#/components/schemas/RetentionCell'
          minItems: 3
          maxItems: 3
      required:
      - first_week
      - size
      - cells
    Adoption:
      type: object
      additionalProperties: false
      properties:
        context_id: *id001
        stats:
          $ref: '#/components/schemas/UsageStats'
        stable_range:
          $ref: '#/components/schemas/Range'
        frequency:
          type: array
          items:
            $ref: '#/components/schemas/FrequencyBucket'
          minItems: 4
          maxItems: 4
        retention:
          type: array
          items:
            $ref: '#/components/schemas/RetentionCohort'
          maxItems: 12
      required:
      - context_id
      - stats
      - stable_range
      - frequency
      - retention
    EntitySummary:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
          - unknown
      required:
      - id
      - name
      - status
    ComparisonRow:
      type: object
      additionalProperties: false
      properties:
        entity:
          $ref: '#/components/schemas/EntitySummary'
        stats:
          $ref: '#/components/schemas/UsageStats'
      required:
      - entity
      - stats
    TeamDetail:
      type: object
      additionalProperties: false
      properties:
        team:
          $ref: '#/components/schemas/EntitySummary'
        primary_role:
          anyOf:
          - $ref: '#/components/schemas/EntitySummary'
          - type: 'null'
        stats:
          $ref: '#/components/schemas/UsageStats'
        adoption:
          $ref: '#/components/schemas/Adoption'
      required:
      - team
      - primary_role
      - stats
      - adoption
    MemberRow:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name:
          type: string
        team:
          anyOf:
          - $ref: '#/components/schemas/EntitySummary'
          - type: 'null'
        role:
          anyOf:
          - $ref: '#/components/schemas/EntitySummary'
          - type: 'null'
        status:
          type: string
          enum:
          - active
          - disabled
        active_days:
          anyOf:
          - *id012
          - type: 'null'
        tokens:
          anyOf:
          - $ref: '#/components/schemas/TokenCount'
          - type: 'null'
        stable:
          anyOf:
          - *id005
          - type: 'null'
      required:
      - id
      - name
      - team
      - role
      - status
      - active_days
      - tokens
      - stable
    MemberDetail:
      type: object
      additionalProperties: false
      properties:
        context_id: *id001
        member:
          $ref: '#/components/schemas/MemberRow'
        application_usage:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              application:
                anyOf:
                - $ref: '#/components/schemas/EntitySummary'
                - type: 'null'
                description: 无应用映射的已授权调用汇入null组，不虚构可跳转应用ID。
              requests: *id012
              tokens:
                anyOf:
                - $ref: '#/components/schemas/TokenCount'
                - type: 'null'
            required:
            - application
            - requests
            - tokens
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
        has_more: *id005
      required:
      - context_id
      - member
      - application_usage
      - next_cursor
      - has_more
      allOf:
      - if:
          properties:
            has_more:
              const: true
        then:
          properties:
            next_cursor:
              type: string
              minLength: 1
        else:
          properties:
            next_cursor:
              type: 'null'
    ApplicationRow:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name:
          type: string
        type:
          type: string
          enum:
          - tool
          - agent
          - skill
          - workflow
        summary:
          type: string
        current_version_id: *id001
        stats:
          $ref: '#/components/schemas/UsageStats'
      required:
      - id
      - name
      - type
      - summary
      - current_version_id
      - stats
    ApplicationDetail:
      type: object
      additionalProperties: false
      properties:
        application:
          $ref: '#/components/schemas/ApplicationRow'
        scene_ids:
          type: array
          maxItems: 100
          items: *id001
        team_ids:
          type: array
          maxItems: 100
          items: *id001
        knowledge_ids:
          type: array
          maxItems: 100
          items: *id001
        evaluation_ids:
          type: array
          maxItems: 100
          items: *id001
        relations_truncated: &id013
          type: boolean
      required:
      - application
      - scene_ids
      - team_ids
      - knowledge_ids
