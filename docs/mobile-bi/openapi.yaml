                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "限流，等待 Retry-After 后再试",
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer"
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "properties": {
                  "token": {
                    "type": "string",
                    "minLength": 32,
                    "maxLength": 128
                  },
                  "scene": {
                    "type": "string",
                    "minLength": 32,
                    "maxLength": 32,
                    "pattern": "^[A-Za-z0-9_-]{32}$",
                    "description": "仅创建邀请时返回的扫码凭证；对应小程序 query.scene。"
                  }
                },
                "oneOf": [
                  {
                    "required": [
                      "token"
                    ],
                    "not": {
                      "required": [
                        "scene"
                      ]
                    }
                  },
                  {
                    "required": [
                      "scene"
                    ],
                    "not": {
                      "required": [
                        "token"
                      ]
                    }
                  }
                ],
                "additionalProperties": false
              }
            }
          }
        },
        "description": "使用 token 或 scene 二选一，必须持有小程序 Bearer。只读预览，不消费邀请。"
      }
    },
